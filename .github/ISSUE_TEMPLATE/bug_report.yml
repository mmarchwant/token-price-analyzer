name: Bug Report
description: Report a bug or error in the application
title: '[Bug]: '
labels: ['bug']
body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      placeholder: Describe what happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      placeholder: Describe what you expected to happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: "1. Go to...\n2. Click on...\n3. See error..."
    validations:
      required: false
  - type: input
    id: page_url
    attributes:
      label: Page URL (with share link)
      placeholder: https://...
    validations:
      required: false
  - type: input
    id: browser
    attributes:
      label: Browser / Operating System
      placeholder: e.g. Chrome 122 on macOS
    validations:
      required: false
